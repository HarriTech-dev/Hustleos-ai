kind = "web"
previewPath = "/nextjs/"
title = "HustleOS AI Next.js"
version = "1.0.0"
id = "artifacts/hustle-os-nextjs"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/nextjs/" ]
localPort = 24781

[services.development]
run = "pnpm --filter @workspace/hustle-os-nextjs run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hustle-os-nextjs", "run", "build" ]
publicDir = "artifacts/hustle-os-nextjs/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24781"
BASE_PATH = "/nextjs/"
